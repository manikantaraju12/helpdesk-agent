# ─────────────────────────────────────────────────────────────
# docker-compose.yml — IT Helpdesk Agent
# One-command startup: docker-compose up -d
# ─────────────────────────────────────────────────────────────
version: "3.9"

services:
  helpdesk-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helpdesk-agent
    ports:
      - "8000:8000"
    environment:
      TOKEN_BUDGET_LIMIT: ${TOKEN_BUDGET_LIMIT:-4000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      # Mount logs directory so context JSON files are accessible on the host
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
